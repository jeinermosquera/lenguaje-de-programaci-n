<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2C4756">
    <link rel="icon" type="image/x-icon" href="/inicio/favicon/favicon.ico">
    <title>Admin - Usuarios</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark admin-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/admin/"><i class="bi bi-shield-lock-fill me-2"></i>Admin</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="adminNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link" href="/admin/"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/noticias"><i class="bi bi-newspaper me-1"></i>Noticias</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/eventos"><i class="bi bi-calendar-event me-1"></i>Eventos</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/admin/usuarios"><i class="bi bi-people me-1"></i>Usuarios</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <span class="text-white-50 small d-none d-sm-inline">{{ nombre }}</span>
                    <a href="/user/" class="btn btn-outline-light btn-sm rounded-pill px-3"><i class="bi bi-house-door"></i></a>
                    <a href="/login" class="btn btn-outline-light btn-sm rounded-pill px-3" id="btnLogout"><i class="bi bi-box-arrow-right"></i></a>
                </div>
            </div>
        </div>
    </nav>

    <section class="admin-section">
        <div class="container">
            <div class="mb-4">
                <h2 class="admin-title mb-1">Usuarios</h2>
                <p class="text-secondary mb-0" style="font-size:0.9rem;">Administra los usuarios registrados</p>
            </div>
            <div class="admin-card">
                <div class="table-responsive">
                    <table class="table table-admin mb-0">
                        <thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Registro</th><th class="text-end">Acciones</th></tr></thead>
                        <tbody id="usuariosTableBody"></tbody>
                    </table>
                </div>
                <div id="usuariosEmpty" class="text-center py-4 text-muted small d-none">No hay usuarios.</div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/admin/js/admin.js"></script>
</body>
</html>
