<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2C4756">
    <link rel="icon" type="image/x-icon" href="/inicio/favicon/favicon.ico">
    <title>Admin - Comunidad Info</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark admin-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/admin/"><i class="bi bi-shield-lock-fill me-2"></i>Admin</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="adminNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link active" href="/admin/"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/noticias"><i class="bi bi-newspaper me-1"></i>Noticias</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/eventos"><i class="bi bi-calendar-event me-1"></i>Eventos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/usuarios"><i class="bi bi-people me-1"></i>Usuarios</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <span class="text-white-50 small d-none d-sm-inline">{{ nombre }}</span>
                    <a href="/user/" class="btn btn-outline-light btn-sm rounded-pill px-3"><i class="bi bi-house-door"></i></a>
                    <a href="/login" class="btn btn-outline-light btn-sm rounded-pill px-3" id="btnLogout"><i class="bi bi-box-arrow-right"></i></a>
                </div>
            </div>
        </div>
    </nav>

    <section class="admin-section">
        <div class="container">
            <div class="row mb-4">
                <div class="col-12">
                    <h2 class="admin-title">Dashboard</h2>
                    <p class="text-secondary" style="font-size:0.9rem;">Panel de administracion</p>
                </div>
            </div>
            <div class="row g-4 mb-4" id="statsContainer">
                <div class="col-md-4"><div class="admin-card stat-card"><div class="stat-number" id="statNoticias">0</div><div class="stat-label">Noticias</div></div></div>
                <div class="col-md-4"><div class="admin-card stat-card"><div class="stat-number" id="statEventos">0</div><div class="stat-label">Eventos</div></div></div>
                <div class="col-md-4"><div class="admin-card stat-card"><div class="stat-number" id="statUsuarios">0</div><div class="stat-label">Usuarios</div></div></div>
            </div>
            <div class="row g-4">
                <div class="col-md-6">
                    <div class="admin-card h-100">
                        <h5 class="fw-bold mb-3"><i class="bi bi-newspaper me-2" style="color:var(--accent);"></i>Ultimas noticias</h5>
                        <div id="ultimasNoticias"><p class="text-muted small mb-0">Cargando...</p></div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="admin-card h-100">
                        <h5 class="fw-bold mb-3"><i class="bi bi-calendar-event me-2" style="color:var(--accent);"></i>Ultimos eventos</h5>
                        <div id="ultimosEventos"><p class="text-muted small mb-0">Cargando...</p></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/admin/js/admin.js"></script>
</body>
</html>
