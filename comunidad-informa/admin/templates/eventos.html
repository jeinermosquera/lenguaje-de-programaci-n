<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2C4756">
    <link rel="icon" type="image/x-icon" href="/inicio/favicon/favicon.ico">
    <title>Admin - Eventos</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark admin-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/admin/"><i class="bi bi-shield-lock-fill me-2"></i>Admin</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="adminNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link" href="/admin/"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/noticias"><i class="bi bi-newspaper me-1"></i>Noticias</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/admin/eventos"><i class="bi bi-calendar-event me-1"></i>Eventos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/usuarios"><i class="bi bi-people me-1"></i>Usuarios</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <span class="text-white-50 small d-none d-sm-inline">{{ nombre }}</span>
                    <a href="/user/" class="btn btn-outline-light btn-sm rounded-pill px-3"><i class="bi bi-house-door"></i></a>
                    <a href="/login" class="btn btn-outline-light btn-sm rounded-pill px-3" id="btnLogout"><i class="bi bi-box-arrow-right"></i></a>
                </div>
            </div>
        </div>
    </nav>

    <section class="admin-section">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="admin-title mb-1">Eventos</h2>
                    <p class="text-secondary mb-0" style="font-size:0.9rem;">Gestiona los eventos</p>
                </div>
                <a href="/admin/eventos/nuevo" class="btn btn-accent btn-sm rounded-pill px-3"><i class="bi bi-plus-lg me-1"></i>Nuevo</a>
            </div>
            <div class="d-flex flex-wrap align-items-center gap-3 mb-4">
                <div class="d-flex flex-wrap gap-2" id="filtroCategorias"></div>
                <div class="d-flex align-items-center gap-2 ms-auto">
                    <select class="form-select form-select-sm" id="filtroAnio" style="width:95px;">
                        <option value="">Año</option>
                        <option value="2024">2024</option>
                        <option value="2025">2025</option>
                        <option value="2026">2026</option>
                        <option value="2027">2027</option>
                        <option value="2028">2028</option>
                        <option value="2029">2029</option>
                        <option value="2030">2030</option>
                    </select>
                    <select class="form-select form-select-sm" id="filtroMes" style="width:120px;">
                        <option value="">Mes</option>
                        <option value="1">Enero</option>
                        <option value="2">Febrero</option>
                        <option value="3">Marzo</option>
                        <option value="4">Abril</option>
                        <option value="5">Mayo</option>
                        <option value="6">Junio</option>
                        <option value="7">Julio</option>
                        <option value="8">Agosto</option>
                        <option value="9">Septiembre</option>
                        <option value="10">Octubre</option>
                        <option value="11">Noviembre</option>
                        <option value="12">Diciembre</option>
                    </select>
                    <select class="form-select form-select-sm" id="filtroDia" style="width:85px;">
                        <option value="">Día</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                        <option value="11">11</option>
                        <option value="12">12</option>
                        <option value="13">13</option>
                        <option value="14">14</option>
                        <option value="15">15</option>
                        <option value="16">16</option>
                        <option value="17">17</option>
                        <option value="18">18</option>
                        <option value="19">19</option>
                        <option value="20">20</option>
                        <option value="21">21</option>
                        <option value="22">22</option>
                        <option value="23">23</option>
                        <option value="24">24</option>
                        <option value="25">25</option>
                        <option value="26">26</option>
                        <option value="27">27</option>
                        <option value="28">28</option>
                        <option value="29">29</option>
                        <option value="30">30</option>
                        <option value="31">31</option>
                    </select>
                    <button class="btn btn-sm rounded-pill px-3" style="background:var(--accent);color:#fff;border:none;font-size:0.82rem;" id="btnFiltrarFecha">Filtrar</button>
                </div>
            </div>
            <div class="admin-card">
                <div class="table-responsive">
                    <table class="table table-admin mb-0">
                        <thead><tr><th>Titulo</th><th>Fecha</th><th>Ubicacion</th><th>Categoria</th><th class="text-end">Acciones</th></tr></thead>
                        <tbody id="eventosTableBody"></tbody>
                    </table>
                </div>
                <div id="eventosEmpty" class="text-center py-4 text-muted small d-none">No hay eventos.</div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/admin/js/admin.js"></script>
</body>
</html>
